name: RDCM v1.0.0 validation and stable release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release-candidate:
    name: Windows build and validation (MSI candidate only)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build .\RDCM.sln -c Release --nologo
      - name: Run RDCM automated checks
        run: dotnet run --project .\RDCM.Tests\RDCM.Tests.csproj -c Release --no-restore
      - name: Build MSI candidate
        run: dotnet build .\installer\RDCM.Installer.wixproj -c Release --nologo
      - name: Smoke-test MSI installation and uninstall
        shell: pwsh
        run: ./.github/scripts/SmokeTest-RdcmInstaller.ps1 -InstallerPath ./installer/bin/x64/Release/RDCM-1.0.0-win-x64.msi
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $msi = 'installer\bin\x64\Release\RDCM-1.0.0-win-x64.msi'
          if (-not (Test-Path $msi)) { throw "MSI not found at $msi" }
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RDCM-1.0.0-win-x64.msi" | Set-Content -Path 'RDCM-1.0.0-win-x64.msi.sha256' -Encoding ascii
      - name: Stage MSI for manual installer and live RDP validation
        uses: actions/upload-artifact@v4
        with:
          name: RDCM-1.0.0-windows-release-candidate
          path: |
            installer/bin/x64/Release/RDCM-1.0.0-win-x64.msi
            RDCM-1.0.0-win-x64.msi.sha256
          if-no-files-found: error

  promote-v1-0-0-stable:
    name: Promote existing release after maintainer sign-off
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: mark RDCM v1.0.0 stable') }}
    needs: windows-release-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify the published release asset before promotion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected='sha256:dd4356dfa979fb8d423cd06c3e9a37666ec91aff4f111ccafe32133eca5bfb8a'
          actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" \
            --jq '.assets[] | select(.name == "RDCM-1.0.0-win-x64.msi") | .digest')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Refusing stable promotion: published MSI checksum is missing or changed" >&2
            exit 1
          fi
          asset_count="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" \
            --jq '[.assets[].name | select(. == "RDCM-1.0.0-win-x64.msi" or . == "RDCM-1.0.0-win-x64.msi.sha256")] | length')"
          if [[ "$asset_count" != "2" ]]; then
            echo "Refusing stable promotion: expected MSI/checksum asset pair is incomplete" >&2
            exit 1
          fi
          echo "Verified original published MSI identity: $actual"
      - name: Mark v1.0.0 as stable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title "RDCM v1.0.0" \
            --notes-file docs/releases/v1.0.0.md \
            --prerelease=false \
            --latest
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" \
            --jq '{name, prerelease, draft, tag_name}'
