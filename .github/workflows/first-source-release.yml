name: First source preview and Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release-candidate:
    name: Windows build and validation (MSI candidate only)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build solution
        run: dotnet build .\RDCM.sln -c Release --nologo
      - name: Run RDCM automated checks
        run: dotnet run --project .\RDCM.Tests\RDCM.Tests.csproj -c Release --no-restore
      - name: Build MSI candidate
        run: dotnet build .\installer\RDCM.Installer.wixproj -c Release --nologo
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $msi = 'installer\bin\x64\Release\RDCM-1.0.0-win-x64.msi'
          if (-not (Test-Path $msi)) { throw "MSI not found at $msi" }
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RDCM-1.0.0-win-x64.msi" | Set-Content -Path 'RDCM-1.0.0-win-x64.msi.sha256' -Encoding ascii
      - name: Stage MSI for manual installer and live RDP validation
        uses: actions/upload-artifact@v4
        with:
          name: RDCM-1.0.0-windows-release-candidate
          path: |
            installer/bin/x64/Release/RDCM-1.0.0-win-x64.msi
            RDCM-1.0.0-win-x64.msi.sha256
          if-no-files-found: error

  publish-source-preview:
    name: Publish first source-only GitHub prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create v1.0.0 source-only prerelease once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.0 release already exists; preserving it."
            exit 0
          fi
          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RDCM v1.0.0 — source preview" \
            --notes-file docs/releases/v1.0.0.md \
            --prerelease
